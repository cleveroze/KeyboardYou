name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk KeyboardYou.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KeyboardYou-apk
          path: KeyboardYou.apk

      - name: Publish "latest" pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest KeyboardYou.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Keyboard You — свежая сборка" \
            --notes "Автоматическая сборка из ветки ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Скачайте KeyboardYou.apk и установите на Android 8+."
